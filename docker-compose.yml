# Local infrastructure for the demo: one Postgres with pgvector.
# Start:  docker compose up -d      Stop:  docker compose down      (data is kept in the volume)
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: overlook-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # host 5433 -> container 5432 (5432 is used by another local project)
    volumes:
      - overlook-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  overlook-db-data:

[project]
name = "backoffice"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "arinleviti", email = "arin.leviti@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.7.0",
    "docling>=2.149.0",
    "langgraph>=1.2.20",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "voyageai>=0.6.0",
]

[project.scripts]
backoffice = "backoffice:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
